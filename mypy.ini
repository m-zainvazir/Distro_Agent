[mypy]
ignore_missing_imports = True

# ---------------------------------------------------------------------------
# Legacy-ORM typing baseline.
#
# Models use the SQLAlchemy 1.x-style `Column(...)` declaration (not 2.0
# `Mapped[...]` annotations), so mypy infers instance attributes as
# `Column[X]` rather than `X`. This produces false-positive arg-type /
# assignment / misc errors wherever ORM attributes are read or written.
# Runtime is correct (full test suite passes). These overrides suppress only
# those specific codes in only the affected modules; strict checking stays on
# everywhere else.
#
# TODO: remove once models migrate to `Mapped[...]` / `mapped_column(...)`.
# ---------------------------------------------------------------------------

[mypy-app.services.calibration_service]
disable_error_code = arg-type, assignment

[mypy-app.services.email_service]
disable_error_code = arg-type, assignment

[mypy-app.services.campaign_launch]
disable_error_code = arg-type

[mypy-app.api.v1.campaigns]
disable_error_code = arg-type

[mypy-app.core.resume]
disable_error_code = assignment

[mypy-app.tasks.reply_tasks]
disable_error_code = misc, assignment
